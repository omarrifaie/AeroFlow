version: 2

sources:
  - name: openflights
    description: >
      Raw OpenFlights static data loaded verbatim (all VARCHAR) into the DuckDB
      `raw` schema by the Python ingestion step. Distributed under the Open
      Database License (ODbL). See the project README for attribution.
    database: aeroflow
    schema: raw
    # Every raw table carries a _loaded_at timestamp set at load time; freshness
    # watches it so a stale/failed ingest surfaces as a warning or error.
    loaded_at_field: _loaded_at
    freshness:
      warn_after: { count: 24, period: hour }
      error_after: { count: 72, period: hour }
    tables:
      - name: raw_airports
        description: "Raw airports feed (airports.dat), one row per airport."
        columns:
          - name: airport_id
            description: "OpenFlights unique airport identifier (as text)."
      - name: raw_airlines
        description: "Raw airlines feed (airlines.dat), one row per airline."
        columns:
          - name: airline_id
            description: "OpenFlights unique airline identifier (as text)."
      - name: raw_routes
        description: "Raw routes feed (routes.dat), one row per airline/source/destination."
        columns:
          - name: source_airport_id
            description: "OpenFlights airport id of the route origin (as text)."
